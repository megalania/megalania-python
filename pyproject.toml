[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megalania"
version = "0.1.0b1"
description = "Megalania scraping API client, generated from the OpenAPI document."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Megalania" }]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3"]
dependencies = ["httpx>=0.23,<0.29", "attrs>=22.2", "typing-extensions>=4.6"]

[project.urls]
Homepage = "https://megalania.io"
Documentation = "https://docs.megalania.io/guides/sdk-python"
Source = "https://github.com/megalania/megalania-python"

[tool.setuptools.packages.find]
include = ["megalania*"]
