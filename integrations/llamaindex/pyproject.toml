[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-index-readers-megalania"
version = "0.1.0"
description = "LlamaIndex reader for the Megalania scraping API."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Megalania" }]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3"]
dependencies = ["megalania>=0.2,<0.3", "llama-index-core>=0.14,<0.15"]

[project.urls]
Homepage = "https://megalania.io"
Documentation = "https://docs.megalania.io/integrations/llamaindex"
Source = "https://github.com/megalania/megalania-python"

[tool.setuptools]
packages = ["llama_index.readers.megalania"]
